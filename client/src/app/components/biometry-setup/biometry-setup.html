<div class="unlock-screen">
  <div class="unlock-inner">
    <div class="biometry-icon" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="52" height="52" fill="none">
        <path d="M12 20c0-9 6-14 12-14s12 5 12 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        <path d="M17 22c0-5 3-8 7-8s7 3 7 8v4c0 6-1 10-3 14" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        <path d="M24 22v6c0 5-1 9-3 13" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
        <path d="M30 24c0 9-2 14-5 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" />
      </svg>
    </div>

    <h1 class="unlock-title">{{ lang.t('biometryTitle') }}</h1>
    <p class="unlock-prompt">{{ lang.t('biometryPrompt') }}</p>

    @if (error()) {
      <p class="unlock-error">{{ error() }}</p>
    }

    <button type="button" class="unlock-primary" [disabled]="busy()" (click)="enable()">
      {{ busy() ? lang.t('biometryEnabling') : lang.t('biometryEnable') }}
    </button>
    <button type="button" class="unlock-ghost" [disabled]="busy()" (click)="skip()">
      {{ lang.t('biometrySkip') }}
    </button>
  </div>
</div>
