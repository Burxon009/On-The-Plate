@if (!isLoggedIn()) {
<div class="page" >
  <main class="card">

    <div class="card-header">
      <app-language-switcher />
      <app-theme-toggle />
    </div>

    <h1>On the plate</h1>
    <p class="subtitle">{{ lang.t('subtitle') }}</p>

    <section class="login">
      <h2>{{ lang.t('loginTitle') }}</h2>

      <p class="description">
        {{ codeRequested() ? lang.t('loginCodePrompt') : lang.t('loginPrompt') }}
      </p>

      @if (!codeRequested()) {
      <form (ngSubmit)="login()">

        <input
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

        <button
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? lang.t('loginContinueLoading') : lang.t('loginContinue') }}
        </button>

      </form>
      } @else {
      <form (ngSubmit)="verifyCode()">

        <input
          type="text"
          name="code"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
          placeholder="123456"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          required
        />

        <input
          type="text"
          name="name"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          [placeholder]="lang.t('loginNamePlaceholder')"
          autocomplete="name"
          required
        />

        <button
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? lang.t('loginConfirmLoading') : lang.t('loginConfirmCode') }}
        </button>

        <button
          type="button"
          class="link-button"
          (click)="changeEmail()"
        >
          {{ lang.t('loginChangeEmail') }}
        </button>

      </form>
      }

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

    </section>

    <footer class="app-footer">Developed by Burkhon</footer>

  </main>
</div>
} @else {
  <router-outlet></router-outlet>
}
