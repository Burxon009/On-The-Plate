@if (!isLoggedIn()) {
<div class="page" >
  <main class="card">

    <div class="logo">U</div>

    <h1 style="font-size: 2rem; font-family: sans-serif;">On the plate</h1>
    <p class="subtitle">Loyalty</p>

    <section class="login">
      <h2>Добро пожаловать 👋</h2>

      <p class="description">
        {{ codeRequested() ? 'Введите код из письма.' : 'Введите email, чтобы войти в программу лояльности.' }}
      </p>

      @if (!codeRequested()) {
      <form (ngSubmit)="login()">

        <input
          type="email"
          name="email"
          [ngModel]="email()"
          (ngModelChange)="email.set($event)"
          placeholder="you@example.com"
          autocomplete="email"
          required
        />

        <button
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? 'Вход...' : 'Продолжить' }}
        </button>

      </form>
      } @else {
      <form (ngSubmit)="verifyCode()">

        <input
          type="text"
          name="code"
          [ngModel]="code()"
          (ngModelChange)="code.set($event)"
          placeholder="123456"
          inputmode="numeric"
          maxlength="6"
          autocomplete="one-time-code"
          required
        />

        <input
          type="text"
          name="name"
          [ngModel]="name()"
          (ngModelChange)="name.set($event)"
          placeholder="Ваше имя"
          autocomplete="name"
          required
        />

        <button
          type="submit"
          [disabled]="loading()"
        >
          {{ loading() ? 'Проверка...' : 'Подтвердить код' }}
        </button>

        <button
          type="button"
          class="link-button"
          (click)="changeEmail()"
        >
          ← Изменить email
        </button>

      </form>
      }

      @if (error()) {
        <p class="error">{{ error() }}</p>
      }

    </section>

  </main>
</div>
} @else {
  <router-outlet></router-outlet>
}
